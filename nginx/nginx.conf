# =============================================================================
# nginx.conf — Load Balancer for Distributed Storage Gateways
#
# Sits in front of two gateway instances:
#   - gateway     (port 9000) — core quorum/erasure gateway
#   - api_gateway (port 9100) — JWT + rate-limiting gateway
#
# Traffic comes in on port 8080 and is round-robin distributed across both.
# If one gateway goes down, Nginx automatically stops sending it traffic.
# =============================================================================

events {
    # Maximum simultaneous connections this worker process can handle.
    # 1024 is a safe default for a dev/midterm setup.
    worker_connections 1024;
}

http {

    # -------------------------------------------------------------------------
    # Upstream block — defines the pool of backend servers
    # -------------------------------------------------------------------------
    # "upstream" is Nginx's name for a group of backend servers.
    # By default Nginx uses round-robin: request 1 → gateway, request 2 → api_gateway,
    # request 3 → gateway, and so on, cycling through equally.
    #
    # "server <host>:<port>" registers one backend.
    # Docker Compose puts all services on the same network, so we use
    # container names as hostnames — Docker's internal DNS resolves them.
    # -------------------------------------------------------------------------
    upstream gateway_pool {
        # Round-robin load balancing (Nginx default — no keyword needed)

        server gateway:9000;      # core gateway — handles quorum replication
        server api_gateway:9100;  # api gateway  — JWT auth + rate limiting

        # keepalive: reuse up to 32 idle connections to backends instead of
        # opening a new TCP connection for every request. Reduces latency.
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Logging format — adds upstream_addr so you can see WHICH backend
    # served each request in the Nginx access log
    # -------------------------------------------------------------------------
    log_format main '$remote_addr "$request" $status '
                    'upstream=$upstream_addr '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Server block — the virtual server that clients connect to
    # -------------------------------------------------------------------------
    server {
        # Listen on port 8080 inside the container.
        # docker-compose will map this to host port 8080.
        listen 8080;

        # ---------------------------------------------------------------------------
        # /health — Nginx's own health endpoint (does NOT proxy to backends).
        # Lets Docker's healthcheck ping Nginx directly without touching the gateways.
        # ---------------------------------------------------------------------------
        location = /health {
            access_log off;           # don't clutter access log with healthcheck noise
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx-lb"}';
        }

        # ---------------------------------------------------------------------------
        # / — forward everything else to the upstream pool
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass http://gateway_pool;

            # Pass the real client IP to the backend so logs show the origin.
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Host             $host;

            # Required for HTTP/1.1 keepalive to backends to work correctly.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts — how long Nginx waits for a backend response.
            proxy_connect_timeout 5s;   # TCP handshake timeout
            proxy_send_timeout    30s;  # time to send the full request
            proxy_read_timeout    30s;  # time to read the full response

            # If a backend fails to connect or returns a 5xx, automatically
            # retry the SAME request on the next backend in the pool.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
